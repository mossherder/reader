<!doctype html>
<html lang="en" data-mode="red">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reader</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reader">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="book"></main>

<div id="empty" hidden>
  <label id="openBig" for="file" role="button">Open PDF</label>
  <ul id="recent"></ul>
</div>

<div id="status" hidden></div>

<div id="tools">
  <div id="row" hidden>
    <label id="open" for="file" role="button" aria-label="Load a new PDF">
      <svg viewBox="0 0 16 16"><path d="M9.5 1.5H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V5z"/><path d="M9.5 1.5V5H13M8 12.5V7.5M5.8 9.6 8 7.4l2.2 2.2"/></svg>
    </label>
    <button id="smaller" type="button" aria-label="Smaller text" class="a">A</button>
    <button id="bigger" type="button" aria-label="Bigger text" class="a big">A</button>
    <button id="mode" type="button" aria-label="Change colour mode"><i></i></button>
  </div>
  <button id="toggle" type="button" aria-label="Show tools" aria-expanded="false">
    <svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg>
  </button>
</div>

<input id="file" type="file" accept="application/pdf,.pdf">
<script type="module" src="app.js"></script>
</body>
</html>
