<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB13B"/>
      <stop offset="1" stop-color="#FF7A00"/>
    </linearGradient>
    <linearGradient id="pageL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#F1F1F1"/>
      <stop offset="0.25" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F1F1F1"/>
      <stop offset="0.25" stop-color="#FFFFFF"/>
    </linearGradient>
    <clipPath id="boltClip"><path id="boltShape" d="M760 92 L640 300 L716 300 L612 508 L870 250 L786 250 L880 92 Z"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- open book -->
  <g transform="translate(0,40)">
    <path d="M512 330 C 430 280 310 268 200 290 L200 720 C 310 700 430 712 512 760 Z" fill="url(#pageL)"/>
    <path d="M512 330 C 594 280 714 268 824 290 L824 720 C 714 700 594 712 512 760 Z" fill="url(#pageR)"/>
    <path d="M512 330 L512 760" stroke="#E2E2E2" stroke-width="6"/>
  </g>
  <!-- lightning bolt, red/blue split with white outline -->
  <g transform="translate(106,11) scale(0.88)">
    <use href="#boltShape" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linejoin="round"/>
    <g clip-path="url(#boltClip)">
      <rect x="560" y="60" width="400" height="480" fill="#1E4FD8"/>
      <polygon points="560,60 790,60 690,540 560,540" fill="#E3242B"/>
    </g>
    <use href="#boltShape" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
  </g>
</svg>
